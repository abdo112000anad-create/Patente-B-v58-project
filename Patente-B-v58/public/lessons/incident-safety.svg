<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
<title id="title">خطوات أولية آمنة عند وقوع حادث</title>
<desc id="desc">ثلاث مراحل مرئية: احمِ الموقع إن أمكن، اطلب المساعدة، وقدّم العون ضمن حدود الأمان والتدريب.</desc>
<rect width="960" height="420" rx="28" fill="#f3f3eb"/>
<path d="M175 207h610" stroke="#9aaf9f" stroke-width="7" stroke-dasharray="16 15"/>
<g transform="translate(100 74)"><circle cx="110" cy="105" r="68" fill="#fffef9" stroke="#dce0d4" stroke-width="5"/><path d="M110 61l48 84H62z" fill="#f2c94c" stroke="#173b32" stroke-width="6" stroke-linejoin="round"/><path d="M110 89v27m0 14v2" stroke="#173b32" stroke-width="8" stroke-linecap="round"/><text x="110" y="225" text-anchor="middle" fill="#173b32" font-family="sans-serif" font-size="25" font-weight="700">أمّن الموضع</text><text x="110" y="265" text-anchor="middle" fill="#67766e" font-family="sans-serif" font-size="17">فقط إن أمكن بأمان</text></g>
<g transform="translate(370 74)"><circle cx="110" cy="105" r="68" fill="#fffef9" stroke="#dce0d4" stroke-width="5"/><path d="M110 55c-28 0-48 21-48 48v42h96v-42c0-27-20-48-48-48z" fill="#e9eee5" stroke="#173b32" stroke-width="6"/><path d="M110 76v55m-27-27h54" stroke="#b64b42" stroke-width="12" stroke-linecap="round"/><path d="M70 160h80" stroke="#173b32" stroke-width="7" stroke-linecap="round"/><text x="110" y="225" text-anchor="middle" fill="#173b32" font-family="sans-serif" font-size="25" font-weight="700">اطلب المساعدة</text><text x="110" y="265" text-anchor="middle" fill="#67766e" font-family="sans-serif" font-size="17">اتصل بخدمات الطوارئ</text></g>
<g transform="translate(640 74)"><circle cx="110" cy="105" r="68" fill="#fffef9" stroke="#dce0d4" stroke-width="5"/><path d="M70 145c0-27 18-44 40-44s40 17 40 44" fill="#e9eee5" stroke="#173b32" stroke-width="6"/><circle cx="110" cy="77" r="20" fill="#f2c94c" stroke="#173b32" stroke-width="5"/><path d="M80 133h60" stroke="#287251" stroke-width="8" stroke-linecap="round"/><text x="110" y="225" text-anchor="middle" fill="#173b32" font-family="sans-serif" font-size="25" font-weight="700">قدّم العون</text><text x="110" y="265" text-anchor="middle" fill="#67766e" font-family="sans-serif" font-size="17">ضمن الأمان والتدريب</text></g>
<text x="480" y="382" text-anchor="middle" fill="#77672b" font-family="sans-serif" font-size="18">مخطط تذكيري تعليمي؛ لا يَستبدل إرشادات خدمات الطوارئ</text>
</svg>
